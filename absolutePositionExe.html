<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .greybox{
            width: 300px;
            height: 150px;
            background-color: grey;
            position:fixed;
            right:20px;
            bottom: 20px;
            

        }
        .xxx{
           background-color: black;
           position: absolute;
           left: -12px;
           top: -12px;
           color: white;
           padding: 4px 8px;
           border-radius:15px;
           font-family: arial;

        }
        .time
        {
            color: white;
            position: absolute;
            bottom: 5px;
            right:5px;
            background-color: black;
            padding: 2px 5px;
            border-radius: 2px;
            font-family:arial;
            font-size: 12px;
            font-weight: 500;

        }
    </style>
</head>
<body>
    <div class="greybox">
        <div class="xxx">X</div>
        <div class="time">0:29</div>
    </div>
</body>
</html>
